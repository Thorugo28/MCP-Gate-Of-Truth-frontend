<table mat-table [dataSource]="rows()">
  <ng-container matColumnDef="key">
    <th mat-header-cell *matHeaderCellDef>Chave</th>
    <td mat-cell *matCellDef="let row" class="key">
      <a [routerLink]="detailsLink(row.key)">{{ row.key }}</a>
    </td>
  </ng-container>

  <ng-container matColumnDef="origin">
    <th mat-header-cell *matHeaderCellDef>Origem</th>
    <td mat-cell *matCellDef="let row">
      <mat-chip>{{ row.originLabel }}</mat-chip>
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">
      <div class="status">
        <got-status-badge [status]="row.status" />
        @if (row.authorization === 'NEEDED') {
          <mat-chip class="needed">Autorização necessária</mat-chip>
          <button mat-stroked-button (click)="authorize.emit(row.key)">
            <mat-icon fontSet="material-symbols-outlined">login</mat-icon>
            Autorizar
          </button>
        } @else if (row.retry) {
          <span class="retry">{{ row.retry }}</span>
        }
      </div>
    </td>
  </ng-container>

  <ng-container matColumnDef="server">
    <th mat-header-cell *matHeaderCellDef>Servidor</th>
    <td mat-cell *matCellDef="let row">{{ row.server }}</td>
  </ng-container>

  <ng-container matColumnDef="toolCount">
    <th mat-header-cell *matHeaderCellDef class="numeric">Tools ligadas</th>
    <td mat-cell *matCellDef="let row" class="numeric">{{ row.toolCount }}</td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
