<mat-toolbar class="topbar">
  <got-logo class="logo" />
  <span class="brand">Gate of Truth</span>
  <span class="subtitle">admin</span>
  <span class="spacer"></span>
  <button
    mat-icon-button
    (click)="themeMode.toggle()"
    [attr.aria-label]="themeMode.mode() === 'dark' ? 'Usar modo claro' : 'Usar modo escuro'"
  >
    <mat-icon fontSet="material-symbols-outlined">{{
      themeMode.mode() === 'dark' ? 'light_mode' : 'dark_mode'
    }}</mat-icon>
  </button>
</mat-toolbar>

<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-nav-list class="nav">
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive
          #rla="routerLinkActive"
          [activated]="rla.isActive"
        >
          <mat-icon matListItemIcon fontSet="material-symbols-outlined">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
